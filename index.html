<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Abacus Sums Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Abacus Sums Generator</h1>

  <div class="controls">
    <label>Operation
      <select id="op">
        <option value="+">Addition (+)</option>
        <option value="-">Subtraction (-)</option>
        <option value="*">Multiplication (×)</option>
        <option value="/">Division (÷)</option>
      </select>
    </label>

    <label>Level
      <select id="level">
        <option value="beginner">Beginner</option>
        <option value="intermediate" selected>Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
    </label>

    <label>Problems per set
      <input id="count" type="number" value="5" min="1" max="50" />
    </label>

    <label>Show answers immediately?
      <select id="autoShow">
        <option value="no" selected>No (reveal on click)</option>
        <option value="yes">Yes</option>
      </select>
    </label>

    <div style="display:flex;align-items:flex-end;">
      <button id="generate">Generate</button>
    </div>
  </div>

  <div id="problemsArea"></div>

  <script src="app.js"></script>
</body>
</html>
