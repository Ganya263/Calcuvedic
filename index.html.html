<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Abacus Sums Generator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width:900px; margin:20px auto; padding:10px; }
    h1 { text-align:center }
    .controls { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    label { display:flex; flex-direction:column; font-size:14px; }
    .problem { font-size:28px; margin:16px 0; }
    .answer { margin-top:8px; }
    button { padding:8px 12px; font-size:14px; cursor:pointer; }
    .result { margin-top:10px; font-weight:600; }
    .small { font-size:13px; color:#555 }
    .grid { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  </style>
</head>
<body>
  <h1>Abacus Sums Generator</h1>

  <div class="controls">
    <label>Operation
      <select id="op">
        <option value="+">Addition (+)</option>
        <option value="-">Subtraction (-)</option>
        <option value="*">Multiplication (×)</option>
        <option value="/">Division (÷)</option>
      </select>
    </label>

    <label>Level
      <select id="level">
        <option value="beginner">Beginner</option>
        <option value="intermediate" selected>Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
    </label>

    <label>Problems per set
      <input id="count" type="number" value="5" min="1" max="50" />
    </label>

    <label>Show answers immediately?
      <select id="autoShow">
        <option value="no" selected>No (reveal on click)</option>
        <option value="yes">Yes</option>
      </select>
    </label>

    <div style="display:flex;align-items:flex-end;">
      <button id="generate">Generate</button>
    </div>
  </div>

  <div id="problemsArea"></div>

  <script>
    // Utility random int inclusive
    function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

    // Generator settings by level
    function levelConfig(level, op){
      if(level==='beginner'){
        return { digitCount: (op==='*' || op==='/') ? 1 : 1, allowCarry:false, maxDigits:2 };
      }
      if(level==='intermediate'){
        return { digitCount: (op==='*' || op==='/') ? 1 : 2, allowCarry:true, maxDigits:3 };
      }
      return { digitCount: (op==='*' || op==='/') ? 2 : 3, allowCarry:true, maxDigits:4 };
    }

    // Generate single problem
    function generateProblem(op, level){
      const cfg = levelConfig(level, op);
      // We'll produce two operands mainly; future: multi-operand
      const digitCount = cfg.digitCount;
      const maxDigits = cfg.maxDigits;

      // choose ranges based on digitCount
      const min = Math.pow(10, digitCount-1);
      const max = Math.pow(10, Math.min(maxDigits, digitCount) ) - 1;

      if(op === '+'){
        const a = rnd(min, max);
        const b = cfg.allowCarry ? rnd(min, max) : rnd(min, Math.max(min, Math.min(max,9)));
        return { text: `${a} + ${b}`, a, b, op, answer: a + b };
      }
      if(op === '-'){
        let a = rnd(min, max);
        let b = rnd(min, max);
        if(!cfg.allowCarry){ // ensure no borrow by making digits simple: make a's digits >= b's digits
          // quick hack: ensure a >= b and generate b as a random smaller number with each digit <= corresponding digit of a
          if(a < b) { const tmp=a; a=b; b=tmp; }
          // keep as is if a>=b
        } else {
          if(a < b) { const tmp=a; a=b; b=tmp; }
        }
        return { text: `${a} - ${b}`, a, b, op, answer: a - b };
      }
      if(op === '*'){
        const a = rnd(min, max);
        const b = rnd(1, Math.min(12, max)); // small multiplier for abacus practice
        return { text: `${a} × ${b}`, a, b, op, answer: a * b };
      }
      if(op === '/'){
        const b = rnd(1, Math.min(12, max)); // divisor
        const q = rnd(min, Math.min(50, max)); // quotient
        const a = b * q + rnd(0, b-1); // dividend possibly with remainder
        return { text: `${a} ÷ ${b}`, a, b, op, answer: Math.floor(a / b), remainder: a % b };
      }
      return null;
    }

    // Render set
    function renderProblems(problems, autoShow){
      const area = document.getElementById('problemsArea');
      area.innerHTML = '';
      const container = document.createElement('div');

      problems.forEach((p, idx)=>{
        const div = document.createElement('div');
        div.className = 'problemBlock';
        const prob = document.createElement('div');
        prob.className = 'problem';
        prob.textContent = (idx+1) + '.  ' + p.text;
        div.appendChild(prob);

        // input and check
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Type answer...';
        input.style.fontSize = '18px';
        input.style.padding = '6px';
        input.style.width = '140px';

        const checkBtn = document.createElement('button');
        checkBtn.textContent = 'Check';
        checkBtn.onclick = ()=> {
          const val = input.value.trim();
          if(val === '') {
            showResult('Enter an answer', 'orange', div);
            return;
          }
          // parse answer: accept integer; for division accept quotient or quotient+rem remainder style
          let correct = false;
          if(p.op === '/'){
            // user may enter "q r" or "q" or "q r=2" etc. We'll accept answers that contain the correct quotient and optionally remainder.
            const parts = val.split(/[ ,/]+/).map(s=>s.replace(/\D/g,'')).filter(Boolean).map(Number);
            if(parts.length===0) { correct=false; }
            else {
              correct = parts[0] === Math.floor(p.answer);
            }
          } else {
            // numeric compare
            const num = Number(val);
            correct = !Number.isNaN(num) && num === p.answer;
          }
          if(correct) showResult('Correct ✓', 'green', div);
          else showResult('Wrong ✗ — Answer: ' + formatAnswer(p), 'red', div);
        };

        const showBtn = document.createElement('button');
        showBtn.textContent = 'Reveal answer';
        showBtn.onclick = ()=> {
          showResult('Answer: ' + formatAnswer(p), '#333', div);
        };

        const controls = document.createElement('div');
        controls.className = 'grid';
        controls.appendChild(input);
        controls.appendChild(checkBtn);
        controls.appendChild(showBtn);
        div.appendChild(controls);

        // auto show
        if(autoShow === 'yes'){
          showResult('Answer: ' + formatAnswer(p), '#333', div);
        }

        area.appendChild(div);
      });
    }

    function formatAnswer(p){
      if(p.op === '/'){
        return `${Math.floor(p.answer)}  remainder ${p.remainder || 0}`;
      }
      if(p.op === '*') return String(p.answer);
      return String(p.answer);
    }

    function showResult(text, color, parent){
      let node = parent.querySelector('.result');
      if(!node){
        node = document.createElement('div');
        node.className = 'result';
        parent.appendChild(node);
      }
      node.textContent = text;
      node.style.color = color;
    }

    // wire up
    document.getElementById('generate').addEventListener('click', ()=>{
      const op = document.getElementById('op').value;
      const level = document.getElementById('level').value;
      const count = Math.max(1, Math.min(50, Number(document.getElementById('count').value || 5)));
      const autoShow = document.getElementById('autoShow').value;
      const problems = [];
      for(let i=0;i<count;i++){
        problems.push(generateProblem(op, level));
      }
      renderProblems(problems, autoShow);
    });

    // initial generate
    document.getElementById('generate').click();
  </script>
</body>
</html>
